name: Build mALauncher APK

on:
  push:
    paths:
      - "mALauncher/**"
      - ".github/workflows/build-malauncher.yml"
  pull_request:
    paths:
      - "mALauncher/**"
      - ".github/workflows/build-malauncher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug and release APK
        working-directory: mALauncher
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mALauncher-apk
          path: mALauncher/app/build/outputs/apk/**/*.apk
